<div class="users-container">
    <app-user-create />
    <h1 class="users-container__title">Список Пользователей</h1>
    @if (store.users() || store.users().length !== 0; as users) {
        {{ users.length | plural :'пользователь' : 'пользователя' : 'пользователей' }}   
    }
    <app-users-filter [searchQuery]="store.searchQuery()" (searchTerm)="store.updateSearch($event)" />

    <div class="user-list">
            @for (user of filteredUsers(); track $index) {
                <app-user-card [user]="user" (removeUser)="store.removeUsers($event)" />
            }
         @empty {
            <div class="user-list__not-found-users">Нет пользователей для отображения</div>
        }
    </div>
</div>
